<!DOCTYPE html>
<html>
<head>
<title>Nicat Game</title>
<style>
body{
text-align:center;
font-family:Arial;
background:#222;
color:white;
}
button{
font-size:30px;
padding:20px;
margin-top:20px;

<body>

<h1>Nicat TV Game</h1>
<h2>Xal: <span id="score">0</span></h2>

<button onclick="addScore()">Bas!</button>

<script>
let score = 0;

function addScore(){
score++;
document.getElementById("score").innerText = score;
}
</script>

</body>
</html>
